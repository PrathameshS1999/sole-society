<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Sole Society: system architecture</title>
  <desc id="d">A static storefront (HTML, CSS, vanilla JavaScript) is pushed to GitHub and deployed by Netlify. In the customer's browser, main.js loads supabase-js from jsDelivr and talks to Supabase: the REST API with row level security for the catalogue, wishlist and addresses, Supabase Auth for accounts, and the place_order() function for checkout. The basket lives in the browser's localStorage.</desc>
  <style>
    .bg{fill:#FFFFFF}
    .panel{fill:#EFF4F4;stroke:#DDE6E6;stroke-width:1.5}
    .card{fill:#FFFFFF;stroke:#DDE6E6;stroke-width:1.5}
    .accent{fill:#DCEBEB;stroke:#0E7C7B;stroke-width:1.5}
    .ink{fill:#0E1A1B}
    .h1{font:700 30px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0E1A1B;letter-spacing:-.01em}
    .h2{font:700 19px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0E1A1B}
    .h3{font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0E1A1B}
    .tx{font:400 13.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#2F3D3E}
    .sm{font:500 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#536466}
    .cap{font:700 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#536466;letter-spacing:.08em}
    .lbl{font:600 12.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0E7C7B}
    .lbl-ink{font:600 12.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0E1A1B}
    .num{font:700 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#FFFFFF}
    .wire{fill:none;stroke:#0E7C7B;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 9;animation:flow 1.2s linear infinite}
    .wire-ink{fill:none;stroke:#0E1A1B;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 9;animation:flow 1.2s linear infinite}
    .wire-soft{fill:none;stroke:#536466;stroke-width:2;stroke-linecap:round;stroke-dasharray:4 8;animation:flow 1.6s linear infinite}
    .rev{animation-direction:reverse}
    .dot{fill:#0E7C7B}
    .dot-ink{fill:#0E1A1B}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.wire,.wire-ink,.wire-soft,.pulse{animation:none}}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0E7C7B"/></marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0E1A1B"/></marker>
    <marker id="ah-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#536466"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <!-- Title -->
  <text class="h1" x="60" y="62">Sole Society: system architecture</text>
  <text class="tx" x="60" y="90">Static storefront (HTML · CSS · vanilla JS) on Netlify, with Supabase for data, accounts and orders. No framework, no build step.</text>

  <!-- ================= Build & deploy (left) ================= -->
  <text class="cap" x="60" y="140">BUILD &amp; DEPLOY</text>

  <rect class="card" x="60" y="155" width="330" height="118" rx="6"/>
  <text class="h2" x="82" y="190">Developer</text>
  <text class="tx" x="82" y="214">Edits pages, css/styles.css, js/main.js</text>
  <text class="tx" x="82" y="235">SQL: supabase/schema.sql + seed.sql</text>
  <text class="sm" x="82" y="257">Built with Claude Code</text>

  <rect class="card" x="60" y="345" width="330" height="118" rx="6"/>
  <text class="h2" x="82" y="380">GitHub</text>
  <text class="tx" x="82" y="404">Public repo · branch main</text>
  <text class="tx" x="82" y="425">Site, SQL, design system, notes</text>
  <text class="sm" x="82" y="447">PrathameshS1999/sole-society</text>

  <rect class="accent" x="60" y="535" width="330" height="140" rx="6"/>
  <text class="h2" x="82" y="570">Netlify</text>
  <text class="tx" x="82" y="594">Global CDN, HTTPS, pretty URLs</text>
  <text class="tx" x="82" y="615">Redeploys on every push to main</text>
  <text class="tx" x="82" y="636">netlify.toml: no build, hides notes/SQL</text>
  <text class="sm" x="82" y="658">sole-society-shoes.netlify.app</text>

  <!-- deploy wires -->
  <path id="p1" class="wire-ink" d="M225 273 V345" marker-end="url(#ah-ink)"/>
  <text class="lbl-ink" x="240" y="314">git push</text>
  <path id="p2" class="wire-ink" d="M225 463 V535" marker-end="url(#ah-ink)"/>
  <text class="lbl-ink" x="240" y="504">auto-deploy</text>
  <circle r="5" class="dot-ink"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="5" class="dot-ink"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>

  <!-- ================= Third-party CDNs (top middle) ================= -->
  <rect class="card" x="520" y="155" width="230" height="78" rx="6"/>
  <text class="h3" x="540" y="185">jsDelivr CDN</text>
  <text class="sm" x="540" y="208">supabase-js 2.45.4 (pinned)</text>
  <rect class="card" x="800" y="155" width="230" height="78" rx="6"/>
  <text class="h3" x="820" y="185">Google Fonts</text>
  <text class="sm" x="820" y="208">Instrument Sans 400–700</text>

  <!-- ================= Browser (middle) ================= -->
  <text class="cap" x="520" y="295">CUSTOMER'S BROWSER</text>
  <rect class="panel" x="520" y="310" width="510" height="560" rx="8"/>
  <!-- window chrome -->
  <circle cx="545" cy="333" r="5" fill="#D7263D" opacity=".75"/>
  <circle cx="563" cy="333" r="5" fill="#DDE6E6"/>
  <circle cx="581" cy="333" r="5" fill="#DDE6E6"/>
  <rect x="600" y="323" width="410" height="20" rx="10" fill="#FFFFFF" stroke="#DDE6E6"/>
  <text class="sm" x="614" y="338">sole-society-shoes.netlify.app</text>

  <rect class="card" x="540" y="362" width="470" height="92" rx="6"/>
  <text class="h3" x="560" y="390">19 static pages</text>
  <text class="tx" x="560" y="413">Home · 10 listings · product.html?p=slug · basket</text>
  <text class="tx" x="560" y="434">checkout · wishlist · account · register · help · about</text>

  <rect class="accent" x="540" y="470" width="470" height="134" rx="6"/>
  <text class="h3" x="560" y="498">js/main.js (vanilla JS)</text>
  <text class="tx" x="560" y="521">Renders cards, filters, sort, search suggestions</text>
  <text class="tx" x="560" y="542">Product gallery, sizes, UK/EU/US conversion</text>
  <text class="tx" x="560" y="563">Sign-in gate for basket, wishlist and checkout</text>
  <text class="tx" x="560" y="584">Calls Supabase with the public (publishable) key</text>

  <rect class="card" x="540" y="620" width="228" height="112" rx="6"/>
  <text class="h3" x="558" y="646">localStorage</text>
  <text class="tx" x="558" y="669">Basket until checkout</text>
  <text class="tx" x="558" y="690">Wishlist (synced)</text>
  <text class="tx" x="558" y="711">Auth session</text>

  <rect class="card" x="782" y="620" width="228" height="112" rx="6"/>
  <text class="h3" x="800" y="646">sessionStorage</text>
  <text class="tx" x="800" y="669">Catalogue cache, 5 min</text>
  <text class="h3" x="800" y="697">js/products.js</text>
  <text class="tx" x="800" y="718">Offline fallback catalogue</text>

  <rect class="card" x="540" y="748" width="470" height="100" rx="6"/>
  <text class="h3" x="560" y="775">css/styles.css · images/</text>
  <text class="tx" x="560" y="798">Design tokens (teal #0E7C7B, sale #D7263D), 4px corners</text>
  <text class="tx" x="560" y="819">82 product photos, 800×800, openly licensed (credited)</text>

  <!-- Netlify -> browser -->
  <path id="p3" class="wire-ink" d="M390 605 H470 Q490 605 490 585 V430 Q490 408 512 408 H540" marker-end="url(#ah-ink)"/>
  <text class="lbl-ink" x="402" y="596">HTML · CSS</text>
  <text class="lbl-ink" x="402" y="630">JS · images</text>
  <circle r="5" class="dot-ink"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <!-- CDNs -> browser -->
  <path class="wire-soft" d="M725 233 V310" marker-end="url(#ah-soft)"/>
  <path class="wire-soft" d="M915 233 V310" marker-end="url(#ah-soft)"/>

  <!-- ================= Supabase (right) ================= -->
  <text class="cap" x="1170" y="140">SUPABASE (BACKEND)</text>
  <rect class="panel" x="1170" y="155" width="370" height="790" rx="8"/>

  <rect class="accent" x="1190" y="175" width="330" height="112" rx="6"/>
  <text class="h3" x="1210" y="203">Auth</text>
  <text class="tx" x="1210" y="226">Email + password, confirm email</text>
  <text class="tx" x="1210" y="247">Password reset · JWT sessions</text>
  <text class="sm" x="1210" y="269">Trigger creates a profiles row</text>

  <rect class="accent" x="1190" y="305" width="330" height="112" rx="6"/>
  <text class="h3" x="1210" y="333">REST API + Row Level Security</text>
  <text class="tx" x="1210" y="356">Public: read active products only</text>
  <text class="tx" x="1210" y="377">Customers: only their own rows</text>
  <text class="sm" x="1210" y="399">Contact form: insert-only</text>

  <rect class="accent" x="1190" y="435" width="330" height="112" rx="6"/>
  <text class="h3" x="1210" y="463">place_order()  (RPC)</text>
  <text class="tx" x="1210" y="486">Re-prices every line from the catalogue</text>
  <text class="tx" x="1210" y="507">Checks size, colour, width, stock</text>
  <text class="sm" x="1210" y="529">The only way to create an order</text>

  <!-- Postgres -->
  <rect class="card" x="1190" y="575" width="330" height="350" rx="6"/>
  <text class="h3" x="1210" y="603">Postgres</text>
  <g>
    <rect x="1208" y="618" width="294" height="72" rx="4" fill="#EFF4F4"/>
    <text class="cap" x="1220" y="638">CATALOGUE</text>
    <text class="tx" x="1220" y="659">products · product_colours</text>
    <text class="tx" x="1220" y="679">product_images · product_sizes · reviews</text>
    <rect x="1208" y="700" width="294" height="72" rx="4" fill="#EFF4F4"/>
    <text class="cap" x="1220" y="720">CUSTOMERS</text>
    <text class="tx" x="1220" y="741">profiles · addresses</text>
    <text class="tx" x="1220" y="761">wishlist_items</text>
    <rect x="1208" y="782" width="294" height="72" rx="4" fill="#EFF4F4"/>
    <text class="cap" x="1220" y="802">ORDERS</text>
    <text class="tx" x="1220" y="823">orders · order_items</text>
    <text class="tx" x="1220" y="843">(test mode, no card captured)</text>
    <rect x="1208" y="864" width="294" height="44" rx="4" fill="#EFF4F4"/>
    <text class="cap" x="1220" y="884">MESSAGES</text>
    <text class="tx" x="1320" y="884">contact_messages</text>
  </g>
  <!-- internal links into Postgres -->
  <path class="wire-soft" d="M1355 417 V435" marker-end="url(#ah-soft)"/>
  <path class="wire-soft" d="M1355 547 V575" marker-end="url(#ah-soft)"/>
  <path class="wire-soft" d="M1530 361 Q1555 361 1555 470 V560 Q1555 575 1530 590" marker-end="url(#ah-soft)"/>

  <!-- ================= Browser <-> Supabase ================= -->
  <!-- 1 auth -->
  <path id="a1" class="wire" d="M1010 515 H1060 Q1080 515 1080 495 V251 Q1080 231 1100 231 H1190" marker-end="url(#ah)"/>
  <!-- 2 catalogue read (two-way) -->
  <path id="a2" class="wire" d="M1010 537 H1090 Q1110 537 1110 517 V381 Q1110 361 1130 361 H1190" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <!-- 3 place_order -->
  <path id="a3" class="wire" d="M1010 559 H1120 Q1140 559 1140 539 V511 Q1140 491 1160 491 H1190" marker-end="url(#ah)"/>
  <circle r="5" class="dot"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
  <circle r="5" class="dot"><animateMotion dur="2.2s" begin=".7s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
  <circle r="5" class="dot"><animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#a2"/></animateMotion></circle>
  <circle r="5" class="dot"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>

  <!-- step badges on the wires -->
  <g class="pulse"><circle cx="1080" cy="300" r="11" fill="#0E7C7B"/><text class="num" x="1080" y="304" text-anchor="middle">1</text></g>
  <g class="pulse"><circle cx="1110" cy="440" r="11" fill="#0E7C7B"/><text class="num" x="1110" y="444" text-anchor="middle">2</text></g>
  <g class="pulse"><circle cx="1140" cy="522" r="11" fill="#0E7C7B"/><text class="num" x="1140" y="526" text-anchor="middle">3</text></g>

  <!-- ================= Legend ================= -->
  <rect class="card" x="60" y="725" width="420" height="220" rx="6"/>
  <text class="cap" x="82" y="752">WHAT TRAVELS WHERE</text>
  <g transform="translate(82 770)">
    <circle cx="11" cy="11" r="11" fill="#0E7C7B"/><text class="num" x="11" y="15" text-anchor="middle">1</text>
    <text class="h3" x="32" y="9">Sign in / register</text>
    <text class="sm" x="32" y="27">Supabase Auth returns a session (JWT)</text>
  </g>
  <g transform="translate(82 825)">
    <circle cx="11" cy="11" r="11" fill="#0E7C7B"/><text class="num" x="11" y="15" text-anchor="middle">2</text>
    <text class="h3" x="32" y="9">Catalogue, wishlist, addresses, orders</text>
    <text class="sm" x="32" y="27">REST reads/writes, filtered by RLS policies</text>
  </g>
  <g transform="translate(82 880)">
    <circle cx="11" cy="11" r="11" fill="#0E7C7B"/><text class="num" x="11" y="15" text-anchor="middle">3</text>
    <text class="h3" x="32" y="9">Checkout</text>
    <text class="sm" x="32" y="27">rpc('place_order') prices the basket in the DB</text>
  </g>
    <path class="wire-ink" d="M330 752 H372" marker-end="url(#ah-ink)"/>
  <text class="sm" x="380" y="756">deploy</text>

  <text class="sm" x="1540" y="975" text-anchor="end">Sole Society demo store · built by Prathamesh Shinde · prathameshshinde.com</text>
</svg>
